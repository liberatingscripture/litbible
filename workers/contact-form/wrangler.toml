# LIT Bible contact-form backend (FIXLIST F1).
#
# This is a standalone Cloudflare Worker (NOT a Pages Function — Pages
# Functions don't support the send_email binding). It is deployed separately
# from the site with `npm run deploy` in this directory; see README.md for
# the one-time dashboard setup (Email Routing destination, secrets, route).
#
# The route lives at /contact/submit deliberately — /api/* is the mobile-app
# sync contract namespace and must stay Pages-served (see CLAUDE.md).

name = "litbible-contact-form"
main = "src/index.js"
compatibility_date = "2026-06-01"

# One Worker backs two forms. The route pathname selects the per-form config
# (destination inbox, Turnstile secret, subject, thanks/back URLs) inside
# src/index.js. Both stay OUTSIDE /api/* (the mobile-app sync namespace).
routes = [
  { pattern = "litbible.net/contact/submit", zone_name = "litbible.net" },
  { pattern = "litbible.net/app-support/submit", zone_name = "litbible.net" }
]

# Email Routing send binding. The destination is intentionally NOT pinned
# here: the recipient inbox is set as the DEST_EMAIL secret so a personal
# address never lands in the public repo. Cloudflare still requires it to be
# a verified Email Routing destination address on this zone.
[[send_email]]
name = "CONTACT_EMAIL"

# Per-IP cap on submissions (Workers rate-limiting binding — no dashboard
# rule needed): over the limit -> 429 with a "wait a minute" message. The
# limiter is best-effort per Cloudflare location, which is plenty for a
# contact form; Turnstile remains the real bot gate.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[vars]
# Must be an address on a domain with Email Routing enabled (this zone).
FROM_EMAIL = "contact@litbible.net"

# Secrets (set once with `npx wrangler secret put <NAME>` — see README.md):
#   TURNSTILE_SECRET             — Turnstile secret for the /contact widget
#   DEST_EMAIL                   — inbox that receives /contact messages (a
#                                  verified Email Routing destination address)
#   DISPLAY_TO                   — optional: address shown in the /contact To:
#                                  header (a branded alias) while delivery still
#                                  goes to DEST_EMAIL; omit to show DEST_EMAIL
#   APP_SUPPORT_TURNSTILE_SECRET — Turnstile secret for the /app-support widget
#                                  (a SEPARATE dashboard widget from contact's)
#   APP_SUPPORT_DEST_EMAIL       — inbox that receives /app-support messages
#                                  (its own verified Email Routing destination)
#   APP_SUPPORT_DISPLAY_TO       — optional: address shown in the /app-support
#                                  To: header while delivery still goes to
#                                  APP_SUPPORT_DEST_EMAIL; omit to show it
