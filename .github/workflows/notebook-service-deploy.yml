# Deploys the notebook service (workers/notebook-service) and rolls it back.
#
# THE PREVIEW: ON SINCE 2026-11-23. A merge to `main` that touches the
# package deploys the preview, and "Run workflow" deploys or rolls it back on
# demand. The repository variable NOTEBOOK_PREVIEW_DEPLOYS is "on" (unset,
# its two jobs are skipped; that is its switch). BVJ chose this workflow as
# the way BDR rolls the service back (workers/notebook-service/README.md,
# "Who can deploy and roll back"), and a deploy, a rollback, and a second
# deploy were each run from it that day.
#
# PRODUCTION: PREPARED IN STEP 4F, OFF, AND NEVER RUN. Its two jobs differ
# from the preview's on purpose:
#   - they never run on a push. Production is deployed only by "Run
#     workflow" on `main` with environment `production`, by a person;
#   - they are skipped unless the repository variable
#     NOTEBOOK_PRODUCTION_DEPLOYS is "on", which it is not;
#   - they read their token from GitHub environments of their own,
#     `notebook-production` (the deploy, with BVJ as a required reviewer)
#     and `notebook-production-rollback` (no reviewer, so BDR can roll back
#     alone), which don't exist until BVJ makes them;
#   - the deploy refuses to start while wrangler.jsonc still holds the
#     placeholder for production's database id.
# Whether and when to turn production on is BVJ's (README, "Production").
#
# Why it exists: when the service breaks, BVJ answers first and BDR second
# (STUDY-DESK-ENCRYPTION.md, "Still open," 17), and only BVJ can reach the
# Cloudflare account. With this on, anyone with write access to this
# repository can roll the Worker back from the Actions tab ("Run workflow,"
# action: rollback), with no access to Cloudflare at all
# (workers/notebook-service/RUNBOOK.md).
#
# What it needs, all of it BVJ's to set up (names only here, never a value):
#   - a GitHub environment named `notebook-preview`, limited to the `main`
#     branch, holding the secrets CLOUDFLARE_API_TOKEN and
#     CLOUDFLARE_ACCOUNT_ID, and optionally NOTEBOOK_PREVIEW_SECRET (the
#     preview's own secret, which lets a deploy check itself);
#   - the repository variable NOTEBOOK_PREVIEW_DEPLOYS = on, and, with that
#     optional secret, NOTEBOOK_PREVIEW_URL (the preview's address);
#   - for production, when BVJ decides: a GitHub environment named
#     `notebook-production`, limited to `main`, with BVJ as a required
#     reviewer, holding CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID of its
#     own; a second, `notebook-production-rollback`, limited to `main` with
#     no reviewer, holding the same two; and the repository variables
#     NOTEBOOK_PRODUCTION_DEPLOYS = on and NOTEBOOK_PRODUCTION_URL
#     (production's address).
# An environment's branch limit is what keeps its token out of a workflow
# pushed on any other branch: don't store these as plain repository secrets.
#
# It deploys with the wrangler in the package's own lockfile, the one its
# tests ran with, and not with an action that brings its own.
name: Notebook service

on:
  push:
    branches: [main]
    paths:
      - workers/notebook-service/**
      - .github/workflows/notebook-service-deploy.yml
  workflow_dispatch:
    inputs:
      environment:
        description: "which deployment: the preview (test data), or production (readers' notebooks)"
        type: choice
        options: [preview, production]
        default: preview
      action:
        description: "deploy what is on main, or roll back to an earlier version"
        type: choice
        options: [deploy, rollback]
        default: deploy
      version:
        description: "rollback only: the version ID to return to (empty: the one before the current)"
        type: string
        required: false
      reason:
        description: "rollback only: why, in a few words (kept with the deployment; nothing personal)"
        type: string
        required: false

permissions:
  contents: read

# Each job's queue is set on the job (`concurrency` below), never here: a
# deploy and a rollback of one deployment wait in different queues, so a
# merge that arrives while a rollback is waiting can't cancel it (GitHub
# keeps one waiting run in a queue and cancels the older). One deploy at a
# time for each deployment, and one rollback.
#
# WHY TESTING AND DEPLOYING ARE TWO JOBS (BVJ, 2026-11-26; Study Desk Audit 9,
# SEC9-2). Steps of one job share the machine's files, and `npm ci` lets any
# of the package's dependencies run its own install script, so code from any
# of them could change what a later step runs before that step gets the
# Cloudflare token. So the tests run in a job with no secret at all, and each
# job that holds the token starts on a fresh machine, installs with
# `--ignore-scripts` (wrangler needs none), and runs only wrangler and this
# repository's own scripts. The actions are pinned by commit, which
# Dependabot's `github-actions` stream keeps moving.

jobs:
  # The service's own tests, with no environment and no secret. Every deploy
  # needs it; a rollback doesn't, since it puts back code that already ran.
  test:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || inputs.action == 'deploy')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/notebook-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: workers/notebook-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Nothing is deployed that fails its own tests.
      - name: Run the service's tests
        run: npm test

  deploy:
    needs: test
    if: >-
      vars.NOTEBOOK_PREVIEW_DEPLOYS == 'on' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || (inputs.action == 'deploy' && inputs.environment == 'preview'))
    runs-on: ubuntu-latest
    environment: notebook-preview
    concurrency:
      group: notebook-service-deploy-preview
      cancel-in-progress: false
    defaults:
      run:
        working-directory: workers/notebook-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No npm cache here: the test job may have written it.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install dependencies, running no package's scripts
        run: npm ci --ignore-scripts

      # Migrations first: a migration must work with the code already deployed
      # (README, "Migrations"), so the gap between these two steps is safe.
      # The Cloudflare token is given to the steps that call Cloudflare and to
      # no other.
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply DB --env preview --remote

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env preview

      # The same walkthrough the tests run, against the deployed service. It
      # runs when the variable NOTEBOOK_PREVIEW_URL is set, and then it needs
      # the preview's own secret stored as NOTEBOOK_PREVIEW_SECRET: set the two
      # together. With neither, a deploy doesn't check itself. It imports this
      # repository's files and Node's own modules, no package.
      - name: Check the deployed service
        if: ${{ vars.NOTEBOOK_PREVIEW_URL != '' }}
        env:
          PREVIEW_SECRET: ${{ secrets.NOTEBOOK_PREVIEW_SECRET }}
          NOTEBOOK_URL: ${{ vars.NOTEBOOK_PREVIEW_URL }}
        run: npm run walkthrough

  rollback:
    if: >-
      vars.NOTEBOOK_PREVIEW_DEPLOYS == 'on' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.environment == 'preview' &&
      inputs.action == 'rollback'
    runs-on: ubuntu-latest
    environment: notebook-preview
    concurrency:
      group: notebook-service-rollback-preview
      cancel-in-progress: false
    defaults:
      run:
        working-directory: workers/notebook-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install dependencies, running no package's scripts
        run: npm ci --ignore-scripts

      - name: Versions before
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deployments list --env preview

      # Code only: a rollback never undoes a D1 migration, which is why every
      # migration has to work with the version before it (README, "Migrations").
      # The inputs reach the shell as environment variables, never as text
      # pasted into the command.
      - name: Roll back
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION: ${{ inputs.version }}
          REASON: ${{ inputs.reason }}
        run: |
          if [ -n "$VERSION" ]; then
            npx wrangler rollback "$VERSION" --env preview --yes --message "${REASON:-rolled back from GitHub Actions}"
          else
            npx wrangler rollback --env preview --yes --message "${REASON:-rolled back from GitHub Actions}"
          fi

      - name: Versions after
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deployments list --env preview

  # ── Production. Prepared in step 4f, off, and never run. ──────────────────
  # By hand only: there is no `push` in either condition below.
  deploy-production:
    needs: test
    if: >-
      vars.NOTEBOOK_PRODUCTION_DEPLOYS == 'on' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.environment == 'production' &&
      inputs.action == 'deploy'
    runs-on: ubuntu-latest
    environment: notebook-production
    concurrency:
      group: notebook-service-deploy-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: workers/notebook-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install dependencies, running no package's scripts
        run: npm ci --ignore-scripts

      # The database is BVJ's to make, and its id is committed like the
      # preview's. Until it is, nothing below may run.
      - name: Refuse while production's database id is the placeholder
        run: |
          if grep -q '"database_id": "00000000-0000-0000-0000-000000000000"' wrangler.jsonc; then
            echo "::error::wrangler.jsonc still holds the placeholder for production's database id (README, \"Production\")."
            exit 1
          fi

      # Migrations first, and for good: a rollback never undoes one.
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply DB --env production --remote

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env production

      # The walkthrough needs the preview's way in, which production never
      # has. This check needs no secret and writes nothing: it reads what the
      # service says of itself, and that the preview's way in is not there.
      - name: Check the deployed service
        if: ${{ vars.NOTEBOOK_PRODUCTION_URL != '' }}
        env:
          NOTEBOOK_URL: ${{ vars.NOTEBOOK_PRODUCTION_URL }}
        run: npm run check:production

  # Production's rollback has an environment of its own,
  # `notebook-production-rollback`, limited to `main` and with no required
  # reviewer, so BDR can roll production back alone when BVJ can't be reached
  # (BVJ, 2026-11-26; Study Desk Audit 9, SV9-2). A rollback only puts back an
  # earlier version of the code. The deploy's environment keeps its reviewer.
  rollback-production:
    if: >-
      vars.NOTEBOOK_PRODUCTION_DEPLOYS == 'on' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.environment == 'production' &&
      inputs.action == 'rollback'
    runs-on: ubuntu-latest
    environment: notebook-production-rollback
    concurrency:
      group: notebook-service-rollback-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: workers/notebook-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install dependencies, running no package's scripts
        run: npm ci --ignore-scripts

      - name: Versions before
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deployments list --env production

      - name: Roll back
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION: ${{ inputs.version }}
          REASON: ${{ inputs.reason }}
        run: |
          if [ -n "$VERSION" ]; then
            npx wrangler rollback "$VERSION" --env production --yes --message "${REASON:-rolled back from GitHub Actions}"
          else
            npx wrangler rollback --env production --yes --message "${REASON:-rolled back from GitHub Actions}"
          fi

      - name: Versions after
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deployments list --env production
