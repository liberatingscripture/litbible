# CI safety net: the chapter validator otherwise runs only in the local
# pre-commit hook, which --no-verify, GitHub web edits, and hookless clones
# all bypass. This validates every chapter and does a full production build
# (topics/verse/API generation + Astro + Pagefind) on each push and PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow's own GitHub token reads and nothing more: every job here
# installs packages, and none pushes with it (BVJ, 2026-11-26; Study Desk
# Audit 9, SEC9-6). For the same reason a checkout keeps no token on disk.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Astro 6 requires Node >= 22.12; use 24 (current LTS, matches local dev).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate chapter JSON
        run: npm run validate:chapters

      - name: Type-check
        run: npm run check

      - name: Run unit tests
        run: npm test

      # fetch:podcast (first build step) is non-fatal by design — a feed
      # outage reuses the committed XML snapshot and the build continues.
      - name: Build site
        run: npm run build

      # Verify every internal href/#fragment in dist/ resolves (no network).
      - name: Check internal links
        run: npm run check:links

  # The contact-form Worker is a separate package with its own dependency tree
  # (deliberately — it keeps vitest/workerd out of the site's root deps), so the
  # root `npm ci` above never installs it and its tests need their own job.
  worker-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/contact-form
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: workers/contact-form/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Worker tests
        run: npm test

  # The notebook service (workers/notebook-service) is a third package with its
  # own tree, for the same reason. Its tests run the Worker in workerd against a
  # real local D1 with the real migrations, as a client built on the website's
  # encryption reference (src/lib/desk-crypto.mjs, imported by relative path,
  # which needs nothing from the root's node_modules). No Cloudflare account is
  # touched: `npm run check` is a dry-run bundle, the proof that the config and
  # the bundle are sound before anyone deploys.
  notebook-service-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/notebook-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: workers/notebook-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run the service's tests
        run: npm test

      - name: Bundle the Worker (dry run)
        run: npm run check

  # The Worker that counts the content security policy's reports
  # (workers/csp-reports) is a fourth package with its own tree, for the same
  # reason. Its tests run it in workerd against a real local D1 with the real
  # migration and the limiter its config declares. No Cloudflare account is
  # touched.
  csp-reports-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/csp-reports
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: workers/csp-reports/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run the Worker's tests
        run: npm test

      - name: Bundle the Worker (dry run)
        run: npm run check
