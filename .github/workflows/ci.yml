# CI safety net: the chapter validator otherwise runs only in the local
# pre-commit hook, which --no-verify, GitHub web edits, and hookless clones
# all bypass. This validates every chapter and does a full production build
# (topics/verse/API generation + Astro + Pagefind) on each push and PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Astro 6 requires Node >= 22.12; use 24 (current LTS, matches local dev).
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate chapter JSON
        run: npm run validate:chapters

      - name: Type-check
        run: npm run check

      - name: Run unit tests
        run: npm test

      # fetch:podcast (first build step) is non-fatal by design — a feed
      # outage reuses the committed XML snapshot and the build continues.
      - name: Build site
        run: npm run build

      # Verify every internal href/#fragment in dist/ resolves (no network).
      - name: Check internal links
        run: npm run check:links

  # The contact-form Worker is a separate package with its own dependency tree
  # (deliberately — it keeps vitest/workerd out of the site's root deps), so the
  # root `npm ci` above never installs it and its tests need their own job.
  worker-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/contact-form
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: workers/contact-form/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Worker tests
        run: npm test
