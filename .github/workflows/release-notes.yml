name: Auto-update release notes

on:
  push:
    branches: [main]
    paths:
      - 'src/data/chapters/**'
      - 'src/data/intros/**'
      - 'src/content/articles/**'
      - 'src/content/glossary/**'
  # Manual re-run, e.g. to backfill notes after a missed or failed run.
  workflow_dispatch:

jobs:
  update-release-notes:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history needed for git diff in the script
          # main requires PRs for the default GITHUB_TOKEN (github-actions[bot]),
          # which isn't on the branch-ruleset bypass list. RELEASE_NOTES_PAT is a
          # fine-grained PAT scoped to Contents: Read and write on this repo,
          # owned by a bypass-listed account, so this workflow can keep pushing
          # its auto-generated commit straight to main.
          token: ${{ secrets.RELEASE_NOTES_PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Find base ref
        id: base
        run: |
          # Use the commit that last touched release-notes.json as the base,
          # so we only report changes made since the last update.
          # Falls back to the first commit if the file has never been updated.
          LAST=$(git log --format="%H" -- src/data/release-notes.json | head -1)
          if [ -z "$LAST" ]; then
            LAST=$(git rev-list --max-parents=0 HEAD)
          fi
          echo "ref=$LAST" >> "$GITHUB_OUTPUT"

      - name: Draft and write release notes
        run: node scripts/draft-release-notes.mjs --since ${{ steps.base.outputs.ref }} --write

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet src/data/release-notes.json; then
            git add src/data/release-notes.json
            git commit -m "chore: auto-update release notes"
            git push
          fi
