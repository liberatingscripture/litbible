# Dependabot configuration.
#
# Three update streams, because the repo has two independent npm dependency
# trees plus the workflows:
#   1. /                      — the Astro site
#   2. /workers/contact-form  — the Cloudflare Worker (its own package.json +
#                               lockfile; root `npm ci` never reaches it)
#   3. GitHub Actions used by .github/workflows/
#
# Minor and patch bumps are GROUPED into one PR per stream per week, so routine
# churn arrives as a single reviewable change instead of a scattered pile.
# Major bumps are deliberately left UNGROUPED — they get their own PR, because
# a major needs the same hand-checked treatment the Astro 7 upgrade got (verify
# the rendered-output diff, then pin back any default that changes published
# copy — see astro.config.mjs).
#
# That rule is weaker than it looks, and the gap is worth knowing before
# trusting a group PR's title: `update-types` classifies the DIRECT dependency
# only, and semver treats 0.x specially, so a 0.19 -> 0.20 move counts as a
# MINOR and the filter admits it — transitive majors and all. That is how
# @cloudflare/vitest-pool-workers 0.19 -> 0.20 carried miniflare 4 -> 5 (a
# PRERELEASE, 5.x-alpha) and zod 3 -> 4 into a PR labelled "minor-and-patch"
# (2026-08-10, PR #95). Nothing to fix there — it is dev-only and upstream's
# choice for the whole 0.20 line — but on any stream with 0.x direct deps,
# read the lockfile diff rather than the title. The worker stream is the one
# that has them today.
#
# SECURITY updates are a separate track and are NOT configured here. Every
# `groups:` block below is `applies-to: version-updates` (the default), so it
# only shapes the scheduled bumps above. Advisory-driven PRs are grouped by the
# repo setting instead — Settings → Code security → "Grouped security updates"
# (on since 2026-07-28) — which opens one PR per ecosystem per directory.
# Two consequences worth knowing before reviewing one:
#   - A grouped security PR can contain a MAJOR bump. Security updates ignore
#     the `update-types` filters below, so the "majors get their own PR" rule
#     above holds for version updates only; check a security PR for majors
#     before merging.
#   - `open-pull-requests-limit` doesn't apply to it either — that caps
#     version-update PRs only.
# Adding a group here with `applies-to: security-updates` would OVERRIDE the
# repo toggle for that stream; don't, unless the intent is to take that track
# back into config.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      site-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /workers/contact-form
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: build
      include: scope
    groups:
      worker-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
