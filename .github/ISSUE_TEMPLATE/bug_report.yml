name: Bug report
description: Report a technical problem with the site (broken link, rendering bug, accessibility issue, build failure).
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem you ran into.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: false
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A URL, a click path, or a code snippet — whatever gets us there fastest.
    validations:
      required: false
  - type: input
    id: url
    attributes:
      label: Page URL (if applicable)
      placeholder: https://litbible.net/...
    validations:
      required: false
